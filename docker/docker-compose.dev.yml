# Servicios de apoyo para desarrollo local: docker compose -f docker/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: aoc, POSTGRES_PASSWORD: aoc, POSTGRES_DB: aoc }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    # BullMQ exige noeviction; AOF para no perder la cola en reinicios.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/aoc-pagespeed"
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
