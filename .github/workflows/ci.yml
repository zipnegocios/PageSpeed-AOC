name: CI
# Solo manual: Actions > CI > Run workflow. El despliegue lo hace el webhook de EasyPanel en cada
# push a main; este workflow no despliega ni bloquea nada. Las mismas comprobaciones se corren en
# local antes de cada push (typecheck, lint, pruebas, builds).
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: aoc, POSTGRES_PASSWORD: aoc, POSTGRES_DB: aoc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aoc" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://aoc:aoc@localhost:5432/aoc_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:sync && git diff --exit-code src/lib/ui/tokens
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm migrate:build
      - run: pnpm worker:build
